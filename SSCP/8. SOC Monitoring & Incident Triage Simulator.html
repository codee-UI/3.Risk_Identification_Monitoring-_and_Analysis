<style>
:root{--bg:#f6f8f6;--card:#fff;--tx:#1b2a1f;--mu:#5b6b5f;--ac:#2f8a47;--bd:#d8e0d9;--rd:#d33;--am:#d98a00;--gy:#8a948c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}button.atk{background:var(--rd);color:#fff;border-color:var(--rd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px}
svg{width:100%;height:auto;display:block}svg text{fill:var(--tx);font-size:13px}
.st{fill:var(--card);stroke:var(--ac);stroke-width:2}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.stats div{background:var(--bg);border-radius:8px;padding:6px 8px;font-size:12px;color:var(--mu)}.stats b{display:block;font-size:20px;color:var(--tx)}
#log{height:150px;overflow:auto;font:12px/1.5 ui-monospace,monospace}#log p{margin:0;border-bottom:1px solid var(--bd)}
.lg span{margin-right:12px;font-size:13px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.pro{color:var(--ac)}.con{color:var(--rd)}li{margin:2px 0}input[type=text]{width:100%;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
table{border-collapse:collapse;width:100%}td{border-bottom:1px solid var(--bd);padding:5px;vertical-align:top}td:first-child{font-weight:600;white-space:nowrap}.w{overflow-x:auto}
</style></head><body>

<section id="sim">
<div class="card"><div class="ctl">
<button class="pri" id="go">▶ Start</button><button class="atk" id="atk">⚡ Launch attack</button>
<label>Speed <input type="range" id="spd" min="1" max="4" value="2"></label>
<label>Clipping level <input type="range" id="clip" min="1" max="4" value="2"> <b id="cv">2</b> fails</label>
<label><input type="checkbox" id="act"> Active response (IPS)</label></div></div>
<div class="card"><svg viewBox="0 0 860 230" id="svg"></svg>
<div class="lg"><span><i class="dot" style="background:var(--gy)"></i>Failed login (noise)</span><span><i class="dot" style="background:var(--am)"></i>Non-intentional (storm/overload)</span><span><i class="dot" style="background:var(--rd)"></i>Attack step (recon→exfil)</span></div></div>
<div class="card"><div class="stats" id="stats"></div></div>
<div class="card"><b>What is happening now</b><div id="log"></div></div>
<div class="card" id="how" style="font-size:14px"></div>
</section>
<section id="tech" hidden></section>
<section id="gl" hidden><input type="text" id="q" placeholder="Search terms (e.g. SIEM, IoC)…"><div class="card w"><table id="tb"></table></div></section>
<section id="mon" hidden></section><section id="arch" hidden></section><section id="base" hidden></section><section id="dash" hidden></section><section id="risk" hidden></section>

const KC=["Recon","Priv-Esc","Decrypt","Copy data","End session"];
const GL=[["ALE","Annual Loss Expectancy – expected yearly loss to an asset"],["ARO","Annual Rate of Occurrence – expected exploitations per year"],["SLE","Single Loss Expectancy – expected loss from one event"],["ACL","Access Control List – rules a firewall/router uses to permit/deny traffic"],["APT","Advanced Persistent Threat – long-term, stealthy, well-resourced attacker"],["ATT&CK","Adversarial Tactics, Techniques & Common Knowledge (MITRE) – 14 tactics of attacker behaviour"],["CIA / CIANA+PS","Confidentiality, Integrity, Availability (+ Nonrepudiation, Authenticity, Privacy, Safety)"],["CVE","Common Vulnerabilities and Exposures – public catalogue of known flaws"],["CVSS","Common Vulnerability Scoring System – open severity-scoring framework (FIRST.org)"],["EDR / XDR","Endpoint / Extended Detection and Response – ML-driven detection across endpoints and wider telemetry"],["HDFS","Hadoop Distributed File System – big-data store used by some log collectors"],["HIDS / NIDS","Host / Network Intrusion Detection System – detects only (alerts)"],["HIPS / NIPS","Host / Network Intrusion Prevention System – detects and blocks"],["IDS / IPS","Intrusion Detection / Prevention System"],["IoC","Indicator of Compromise – signal that an intrusion is happening or has happened"],["MSSP","Managed Security Services Provider – third party that runs security/SIEM for you"],["NTS","Network Time Service – common clock so events can be time-correlated"],["NIST RMF","National Institute of Standards and Technology Risk Management Framework"],["OT","Operational Technology – industrial/process control systems"],["PCI DSS","Payment Card Industry Data Security Standard – requires 1 year of logs, 3 months online"],["PII","Personally Identifiable Information"],["SEM / SIM","Security Event Management (real-time) / Security Information Management (long-term storage)"],["SIEM","Security Information and Event Management – centralized logging + correlation platform"],["SOC","Security Operations ["Log Management","Collect only what matters, keep it safe.",["Start with most critical resources; be selective per host","Set clipping levels (e.g. log after 2 failed passwords within 30 min)","Filter views by host/user/event/time window","Consolidate logs on a separate server (SIEM)","Retain per law (PCI DSS: 1 yr, 3 months online); else 3 months online + 1 yr offline","Protect from tampering; preserve incident logs with chain of custody"],["Less noise & storage","Forensic and compliance evidence","Central, tamper-resistant copy"],["Over-clipping can hide attacks","Clip levels are secret-worthy","Storage/retention cost"],"Banks & retailers (PCI DSS audits); hospitals (HIPAA audit trails); cloud ops (Elastic, Splunk); government audits & legal evidence"],
["SIEM","One platform = SEM (real-time) + SIM (long-term).",["Aggregate from firewalls, IDS/IPS, hosts, IAM, antimalware","Normalize into a standard format","Correlate by time, space, entity (needs synced clocks)","Analyze with scripts/heuristics","Alert, dashboard & report","Securely archive"],["Single pane of glass","Faster investigations","Cross-system correlation"],["Costly & skill-hungry","Many false positives early on","Time-skew and identity-masking (VPN) complicate correlation"],"Enterprise SOCs & MSSPs (Splunk, IBM QRadar, Microsoft Sentinel); defense/government SOCs; energy & pipeline OT monitoring; shared response in SUNBURST/SolarWinds (2020)"],
["IDS / IPS (EDR / XDR)","IDS watches & alerts; IPS also blocks.",["Capture traffic/host activity","Detect: signature-based or anomaly/baseline-based","Alert","Passive response: log, console alert, packet capture, email/SMS","Active response: TCP reset, dynamic ACL change, block system call","Maintain: update signatures, tune, test updates"],["Early warning","Automatic containment (IPS)","EDR/XDR adds long-term, community-wide learning"],["Maintenance burden","Latency/overhead","False positives can block legit users or self-DoS","Attackers adapt faster than defenders"],"Snort/Suricata, Cisco/Palo Alto NGFW; CrowdStrike, Cortex XDR; US federal network protection (CISA EINSTEIN); military networks; hospitals, telecoms. Never counter-attack – legal risk"],
["Incident Triage & Escalation","Cut event-level signals down to those needing human decisions.",["Event of interest detected","Indicators examined: non-intentional (accident, weather, overload) vs hostile","Hostile & predefined → Indicator of Compromise","Review response plan","Analyze: when, where, malware, entry point, identities, data compromised? (Kill Chain / ATT&CK)","Document & escalate to managers with authority; support forensics/compliance"],["Focuses scarce analysts","Prioritizes by harm","Creates audit/forensic record"],["Needs balanced risk appetite vs. cost","Slow if escalation unclear","Bad baselines → wrong priorities"],"Financial and healthcare SOCs, national CERTs, critical infrastructure operators, military cyber commands; breach notification (PII) workflows"]];
$("how").innerHTML="<b>Reading the flow:</b> Events leave <i>Sources</i> → <i>Clipping</i> drops trivial repeats → <i>SIEM</i> normalizes and correlates (3 correlated attack steps = IoC) → <i>Triage</i> separates non-intentional signals from hostile ones → <i>Response</i> is passive (log + alert) or active (block), then documented and escalated. Try raising the clipping level (less noise, but risk of missing things) and toggling active response (watch false positives).";
const tabs=[["sim","Simulation"],["tech","How it works / Pros, Cons, Uses"],["mon","Monitoring controls"],["arch","Logging, SIEM &amp; correlation"],["base","Baselines &amp; analysis"],["dash","Dashboards"],["risk","Risk management"],["gl","Glossary"]];
tabs.forEach(([id,t],i)=>{const b=document.createElement("button");b.textContent=t;b.className=i?"":"on";b.onclick=()=>{tabs.forEach(([k])=>$(k).hidden=k!=id);[...$("tabs").children].forEach(c=>c.className=c==b?"on":"");};$("tabs").append(b)});

const ul=a=>"<ul>"+a.map(x=>`<li>${x}</li>`).join("")+"</ul>",cd=(h,b)=>`<div class="card"><h3>${h}</h3>${b}</div>`,gd=a=>`<div class="grid">${a.join("")}</div>`;

/* MONITORING */
const sel=(n,o)=>`<label>${n}: <select id="s${n}">${o.map(x=>`<option>${x}</option>`).join("")}</select></label> `;
const A={"HIDS":"Agent on the host sees system calls/files and can block a disallowed transaction (HIPS).","NIDS":"Watches network traffic; limited processing, so scope it to your environment. Can reset TCP or change firewall ACLs.","Logging only":"Passive record for forensics and review; no blocking.","Signature-based":"Catches known attacks; needs routine signature updates; misses novel ones.","Statistical anomaly":"Compares to a baseline; can catch new attacks but gives more false positives while learning.","Real-time":"Fast detection/response; more overhead and latency.","Scheduled":"Lower overhead, but detection is delayed.","Push":"Devices send data to a repository where it is stored/analyzed.","Pull":"A management system queries devices for data.","High":"Justified by risk assessment: deploy sensors here first and accept the overhead.","Low":"Limit sensors to save overhead and budget."};
$("mon").innerHTML=cd("Monitoring control configurator","<div class=ctl>"+sel("Technique",["HIDS","NIDS","Logging only"])+sel("Paradigm",["Signature-based","Statistical anomaly"])+sel("Timeliness",["Real-time","Scheduled"])+sel("Reporting",["Push","Pull"])+sel("Asset",["High","Low"])+"</div><div id=mo></div>")+gd([
cd("Maintenance &amp; tuning",ul(["Treat monitoring like a mission-critical system","Keep IDS signatures current","Test then deploy new IDS engine versions (more detection, no instability)","Tune: no Windows hosts → disable Windows exploit signatures; UNIX estate with UNIX signatures off → missed events","Factor security systems into change control"])),
cd("Why manage security information",ul(["<b>Detection &amp; response</b> – first and highest priority","<b>Troubleshooting &amp; forensics</b> – evidence value is lost if poorly managed; also tunes UEBA parameters"])),
cd("Threat hunting, EDR/XDR, UEBA",ul(["Threat models (MITRE) give patterns of attacker behaviour","EDR/XDR reach back months or years and learn across the community, filtered to your business","Compared with HIDS/NIDS they see further back in time","UEBA models normal behaviour of users/entities"])),
cd("Passive vs active response",ul(["<b>Passive:</b> log, console alert, packet-flow capture, page/SMS/email","<b>Active:</b> TCP reset (FIN) both sides, dynamic ACL on firewall/router, HIDS blocks system call","Access control is the strongest IPS: lockout beyond clip level, expired tokens","<b>Never counter-attack</b> – legal risk","Tradeoffs: false positives, self-inflicted DoS, latency, CIA-triad availability effects"]))]);
function mo(){const v="Technique Paradigm Timeliness Reporting Asset".split(" ").map(n=>$("s"+n).value);$("mo").innerHTML=ul(v.map(x=>`<b>${x}:</b> ${A[x]}`))+"<p>Also: put update mechanisms in policy, tune to your environment, choose automatic responses wisely.</p>"}
document.querySelectorAll("#mon select").forEach(s=>s.onchange=mo);mo();
/* ARCH */
$("arch").innerHTML=gd([
cd("Centralized vs decentralized logging",ul(["Local logs on many hosts: slow to search, easy for an admin to alter","Centralized: aggregates logs into one place for evidence of what happened and how the system got there"])),
cd("Distributed log collectors",ul(["Agents on servers/endpoints forward logs to a central server","Collection tier and server scale independently","Linux/Unix/Windows; Flume &amp; Chukwa for HDFS; Splunk plug-in agents add format conversion and cleaning","Can integrate with workflow management"])),
cd("Hosted logging services",ul(["Lower cost than enterprise suites; good price-performance for some","Endpoints forward logs to the host – works only while internet is available"])),
cd("SIEM service models",ul(["<b>Self-hosted, self-managed:</b> you do everything; needs deep in-house skills","<b>Cloud SIEM, self-managed:</b> MSSP collects/aggregates; you place detectors, correlate, respond","<b>Hybrid self-hosted:</b> you run SIEM and sensors; MSSP shares collection/aggregation/correlation","<b>SIEM as a Service:</b> provider does everything up to how you respond"])),
cd("Correlation types",ul(["<b>Time:</b> same-moment signals across systems (e.g. DoS spike); needs NTS reference time and controlled skew","<b>Space:</b> group by location or process pipeline (e.g. all pump/pressure sensors)","<b>Entity:</b> group by identity/entity – harder with VPNs/mobile masking addresses","Every scheme needs a reference baseline"])),
cd("Retention calculator",`<label>Regime <select id="rg"><option>PCI DSS</option><option>No guidance from Legal</option></select></label> <label>Earliest data request (months back) <input type=number id="em" value="9" style="width:70px"></label><p id="rr2"></p>`),
cd("Protecting logs",ul(["Prevent deletion/manipulation (proof of compliance, forensics, error tracing)","May hold sensitive customer data – prevent disclosure","Central secure store stops admins altering local-only logs","Only keep what policy says (e.g. 6 months → no more)"])),
cd("Log anomalies &amp; review",ul(["Anomaly = anything out of the ordinary: gaps in timestamps, account lockouts, writes to protected directories","Logging everything drowns analysts","Host logs: review regularly per policy; live logs OK if logging isn't disrupted","Incident logs: save from all devices along the intruder path, apart from normal retention, with chain of custody (who, where, access); Legal sets retention"]))]);
function rg(){const p=$("rg").value=="PCI DSS";$("rr2").textContent=p?"PCI DSS: keep 1 year of logs, at least 3 months immediately online.":"Keep 3 months online, then offline media for 1 year. Then set standard = earliest request ("+$("em").value+" mo) + 3 = "+(+$("em").value+3)+" months maximum offline retention; document it."}$("rg").onchange=$("em").oninput=rg;rg();

cd("Security baseline",ul(["Assets grouped by sensitivity (classification), compliance needs and chosen controls to protect CIANA+PS","Events on those controls = prima facie indicators of (attempted) compromise","Gives 'be on the lookout' tip-offs","If baseline is too thin for high-value assets, investigate further to enrich it"])),
cd("Example: patient lab results (PHI)<br><small>Click an indicator</small>",`<div class=ctl>${IND.map((x,i)=>`<button onclick="ib(${i})">${x[0]}</button>`).join("")}</div><p id="id1">Compliance dictates who may view results and requires audit logs – these logs reveal exfiltration.</p>`),

cd("Documentation, communication, escalation",ul(["Analysts usually lack authority to act – they must reach managers who can activate response plans","Responders need what has already been determined","Ongoing analysis: forensic, compliance (e.g. notify all persons affected by a PII breach), troubleshooting"]))]);

cd("Visualization tools",ul(["Dashboards: trend lines, status values, event timelines","Maps of systems/geography/pipelines with status and alarms","Infographics, gauges, sparklines, heat maps, bar/pie/fever charts; interactive drill-down and alerts","Correlate with open CVEs","Use graphs for non-technical leaders, but only if they answer management's questions"])),
cd("Build one in 4 steps",ul(["Sketch the ideal answer as a mockup on paper","Find the right data sources","Select, then filter/categorize for comparison, trending, anomaly detection","Format, then ask DB admins/power users to build it"])),
cd("Workflow mindset",ul(["Predefined actions per event, or checklists for initial alarm response","Bring in more data via correlation tools, then alert managers"]))]);

/* RISK */
$("risk").innerHTML=cd("Risk treatment calculator (illustrative assumptions)",`<div class=ctl><label>Asset value <input type=number id=av value=100000 style="width:100px"></label><label>Exposure factor % <input type=number id=ef value=40 style="width:70px"></label><label>ARO <input type=number id=ar value=0.5 step=0.1 style="width:70px"></label><label>Yearly control/premium cost <input type=number id=cc value=8000 style="width:90px"></label></div><div id=rr></div><small>Mitigate assumes controls cut loss ~70%; transfer assumes insurance covers ~80%. Adjust mentally – these are examples, not rules.</small>`)+gd([

cd("NIST RMF &amp; implementation",ul(["Free; aligns with ISO/IEC 27005 and 31000; center = frame the risk","Frame → assess → conduct security/vulnerability assessments → review continuously and prioritize"])),
cd("CVSS &amp; IoC",ul(["CVSS: open framework from FIRST.org scoring a vulnerability and how it changes with time/environment","IoC: signals from events predetermined as likely urgent"])),

cd("Threat modeling",ul(["Identify, categorize, analyze threats to deter, detect, defeat or degrade","APT era: beyond CIA to nonrepudiation, authentication, privacy, safety, data quality","Tailor frameworks to current needs"]))]);

function lg(m){const p=document.createElement("p");p.textContent=new Date().toLocaleTimeString()+" "+m;$("log").prepend(p)}
function stats(){const L={gen:"Generated",clip:"Clipped (dropped)",non:"Non-intentional",fp:"False positives",ioc:"IoCs raised",blk:"Blocked (active)",alr:"Alerted (passive)",esc:"Escalated & documented"};$("stats").innerHTML=Object.keys(L).map(k=>`<div>${L[k]}<b>${c[k]}</b></div>`).join("")}stats();
function spawn(t,l){const el=document.createElementNS(NS,"circle");el.setAttribute("r",7);el.setAttribute("fill",t=="n"?"var(--gy)":t=="x"?"var(--am)":"var(--rd)");const tx=document.createElementNS(NS,"text");tx.setAttribute("font-size",10);tx.textContent=l;pg.append(el,tx);P.push({t,l,x:5,y:70+Math.random()*80,s:0,el,tx,ioc:false});c.gen++}
function kill(p,msg,key){c[key]++;lg(msg);p.dead=1;p.el.setAttribute("opacity",.2)}
function hit(p,i){const clip=+$("clip").value;
if(i==1&&p.t=="n"){p.rep=1+Math.floor(Math.random()*4);if(p.rep<clip)return kill(p,`Clipped: ${p.rep} failed login(s) < clipping level ${clip}`,"clip");lg(`Failed logins ×${p.rep} ≥ clip level → logged`)}
if(i==2){if(p.t=="a"){corr++;p.l="IoC? "+p.l;if(corr>=3&&!p.ioc){p.ioc=1;c.ioc++;lg(`SIEM correlation: ${corr} linked steps from one entity → Indicator of Compromise (${p.l})`)}else lg(`SIEM: normalized + correlated "${p.l}" (${corr}/3)`)}else lg("SIEM: normalized event")}
if(i==3){if(p.t=="x")return kill(p,"Triage: non-intentional cause (weather/overload) → no threat actor, closed","non");if(p.t=="n"){return kill(p,$("act").checked?"Triage: benign mistyped password – ACTIVE response would block a legit user (false positive!)":"Triage: benign mistyped password → false positive, closed","fp")}lg(p.ioc?"Triage: hostile – review response plan":"Triage: suspicious indicator, watch")}
if(i==4&&p.t=="a"){if($("act").checked&&p.ioc){c.blk++;lg("IPS active response: TCP reset + dynamic ACL block of attacker")}else{c.alr++;lg("Passive response: logged + alert sent to analyst")}c.esc++;lg("Documented & escalated to management (chain of custody kept)");p.dead=1}}
function frame(){if(run){tk++;const iv=Math.round(70/sp);if(tk%iv==0)spawn(Math.random()<.6?"n":"x",Math.random()<.6?"fail-login":"storm");if(tk%Math.round(35/sp)==0&&aq.length)spawn("a",aq.shift());
P.forEach(p=>{if(!p.dead){p.x+=1.6*sp*.6;while(p.s<4&&p.x>STG[p.s+1][1]&&!p.dead){p.s++;hit(p,p.s)}if(p.x>850)p.dead=1}else p.fade=(p.fade||0)+1;p.el.setAttribute("cx",p.x);p.el.setAttribute("cy",p.y);p.tx.setAttribute("x",p.x-10);p.tx.setAttribute("y",p.y-11);p.tx.textContent=p.t=="a"?p.l:"";});
P=P.filter(p=>{if(p.dead&&(p.fade>25||p.x>850||p.t=="a")){p.el.remove();p.tx.remove();return false}return true});stats()}requestAnimationFrame(frame)}frame();
$("go").onclick=()=>{run=!run;$("go").textContent=run?"⏸ Pause":"▶ Start";if(run)lg("Simulation running")};
$("atk").onclick=()=>{if(!run)$("go").click();corr=0;aq=KC.slice();lg("⚠ Attacker begins kill chain: "+KC.join(" → "))};
$("spd").oninput=e=>sp=+e.target.value;$("clip").oninput=e=>$("cv").textContent=e.target.value;
</script></body></html>
