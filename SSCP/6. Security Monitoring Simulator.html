<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Security Monitoring Simulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fff;--fg:#1c2b22;--mut:#5b6b61;--card:#f2f7f3;--ac:#2f8f46;--ac2:#8cc63f;--bd:#cfdcd2;--hot:#fff3c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121a15;--fg:#e6f0e8;--mut:#9db0a2;--card:#1b271f;--bd:#2f4136;--hot:#4a4415}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;max-width:980px;margin:auto;padding:12px}
h1{font-size:1.3rem;margin:4px 0}h2{font-size:1.15rem;margin:8px 0}h3{font-size:.95rem;margin:0 0 4px}
#nav{display:flex;gap:6px;overflow-x:auto;padding:6px 0}#nav button,.ctl button{border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
#nav button.on,.ctl button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
svg{width:100%;background:var(--card);border-radius:10px;border:1px solid var(--bd)}svg text{fill:var(--fg);font:11px system-ui,sans-serif;text-anchor:middle}
.nd rect{fill:var(--bg);stroke:var(--ac);stroke-width:1.5;transition:.3s}.nd.hot rect{fill:var(--hot);stroke:var(--ac2);stroke-width:3}.ln{stroke:var(--bd);stroke-dasharray:4 4;stroke-width:1.5}
#pk{fill:var(--ac2);stroke:var(--ac);stroke-width:2}#pt{font-weight:700;fill:var(--ac)}
.ctl{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}#say{background:var(--card);border-left:4px solid var(--ac);padding:8px 12px;border-radius:6px;min-height:70px}
.st{cursor:pointer;padding:4px 8px;border-radius:6px;color:var(--mut)}.st.on{background:var(--hot);color:var(--fg);font-weight:600}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:10px}.g>div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
.g ul{margin:0;padding-left:18px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left;vertical-align:top}#q{width:100%;padding:8px;margin:6px 0;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
</style></head><body>
<h1>Security Monitoring Simulator</h1><div style="color:var(--mut)">Pick a topic, press Play or step through it. Packets show how data and alerts flow.</div>
<div id="nav"></div><div id="mod"></div><div id="gl" hidden><h2>Glossary of terms</h2><input id="q" placeholder="Search a term…"><div style="overflow-x:auto"><table id="gt"></table></div></div>
<script>
const D={"mods": [{"t": "Layers: Strategic, Tactical, Operational", "intro": "Organizations run IT and OT (operational technology) in three management layers with middleware (integration and communications) in between. IoT devices, user interfaces and IaaS/PaaS/SaaS cloud services sit across these layers, and every layer needs security monitoring.", "nodes": [["S", "Strategic|goals: months–years", 110, 35], ["T", "Tactical|integration + comms", 110, 115], ["O", "Operational|IoT · UI · cloud", 110, 195], ["A", "Attacker", 330, 195], ["M", "Security monitoring|logs + sensors + SIEM", 500, 115]], "steps": [{"h": "Set strategy", "d": "Leaders define high-value objectives with time frames of months to years.", "f": "S", "to": "T", "p": "Goals"}, {"h": "Plan tactically", "d": "The middleware layer (integration and communications) turns objectives into granular plans and schedules.", "f": "T", "to": "O", "p": "Plans"}, {"h": "Operate", "d": "Operational tools, IoT/OT devices, UIs and IaaS/PaaS/SaaS services carry out business processes step by step.", "f": "O", "to": "O", "p": "Work"}, {"h": "Attack arrives", "d": "Most attacks hit the tactical or operational layer, such as a point-of-sale device or a smart building.", "f": "A", "to": "O", "p": "Attack"}, {"h": "Collect security data", "d": "Logs, real-time sensors and human guards report to central correlation systems.", "f": "O", "to": "M", "p": "Logs"}, {"h": "Escalate", "d": "Serious findings are reported upward, because a strategic threat can damage the whole business.", "f": "M", "to": "S", "p": "Risk report"}], "pros": ["One shared view of risk from boardroom to device", "Surveillance covers IT, OT and IoT together"], "cons": ["Heterogeneous systems are hard to integrate", "Legacy OT often cannot run monitoring agents"], "apps": {"c": "Retail point-of-sale, smart buildings, logistics", "d": "Command-and-control (IT) linked with weapon and platform control (OT)", "o": "Power grids, hospitals, smart cities, manufacturing"}}, {"t": "DLP: Data Loss Prevention", "intro": "DLP keeps structured and unstructured data under organizational control and in line with policy. It has three components: discovery and classification, monitoring, and enforcement.", "nodes": [["E", "DLP engine|+ usage policy", 300, 30], ["U", "User endpoint|client DLP", 70, 100], ["ST", "Storage / servers|storage DLP", 70, 210], ["G", "Gateway|network DLP", 300, 130], ["X", "Outside world|email, web, cloud", 530, 130]], "steps": [{"h": "Discover and classify", "d": "The engine scans data at rest and tags it (public, internal, confidential). This is ongoing, and most cloud DLP focuses here.", "f": "ST", "to": "E", "p": "Scan"}, {"h": "Define policy", "d": "Administrators define usage policies and push them to endpoints, servers and gateways.", "f": "E", "to": "U", "p": "Policy"}, {"h": "Monitor use", "d": "Data in use and in motion is watched on workstations, servers, storage and at the gateway (HTTP/S, SMTP, FTP).", "f": "U", "to": "G", "p": "Data out"}, {"h": "Detect violation", "d": "The gateway inspects content against policy. Encrypted traffic may need SSL interception.", "f": "G", "to": "E", "p": "Match!"}, {"h": "Enforce", "d": "Options are alert and log, block, reroute for confirmation, or encrypt before the data leaves.", "f": "G", "to": "X", "p": "Block/encrypt"}], "pros": ["Reduces security and regulatory risk (GDPR, HIPAA, PCI DSS)", "Visibility into where sensitive data lives and moves", "Flexible topologies: network, storage, client"], "cons": ["Often requires enterprise architecture changes", "Client DLP is costly to roll out on every endpoint", "Gaps appear if hybrid cloud and on-premises policies differ", "Tuning needed to limit false positives"], "apps": {"c": "Banks protecting card data (PCI DSS), healthcare (HIPAA), SaaS tools like Microsoft Purview", "d": "Stopping classified data leaving via email or USB, and guarding cross-domain transfers", "o": "Law firms, universities, research labs, cloud access security brokers"}}, {"t": "Real-time vs non-real-time monitoring", "intro": "Real-time monitors (network and host IDS/IPS) act like a burglar alarm. Non-real-time monitors (application logs, system logs, integrity monitoring) are like the footprints left behind. Each fills a different niche.", "nodes": [["V", "Event|activity on system", 60, 130], ["R", "Real-time|IDS / IPS alarm", 300, 45], ["L", "Non-real-time|logs + integrity checks", 300, 215], ["A", "Analyst", 540, 45], ["F", "Audit / forensics", 540, 215]], "steps": [{"h": "Event occurs", "d": "A user or attacker action generates an event.", "f": "V", "to": "V", "p": "Event"}, {"h": "Real-time detection", "d": "The IDS sees it immediately, alerts administrators, logs it and (if IPS) may stop it.", "f": "V", "to": "R", "p": "Live"}, {"h": "Alert analyst", "d": "The analyst receives the alert and responds while the intruder is still present.", "f": "R", "to": "A", "p": "Alert"}, {"h": "Log for later", "d": "The same event is saved in system and application logs and compared with the configuration baseline.", "f": "V", "to": "L", "p": "Log"}, {"h": "Review afterwards", "d": "Investigators and auditors reconstruct what happened. Log practice follows NIST SP 800-92 and ISO 27001 A.12.4.", "f": "L", "to": "F", "p": "Evidence"}, {"h": "Tune", "d": "Tuning customizes defaults so real attacks are true positives and normal traffic is not a false positive.", "f": "A", "to": "R", "p": "Tuning"}], "pros": ["Real-time stops or limits damage", "Logs give durable evidence and compliance proof", "Together they give wide coverage"], "cons": ["Real-time systems create false positives and need tuning", "Non-real-time finds out after the attacker is gone", "Log storage and protection take effort"], "apps": {"c": "Security operations centres using Splunk or Sumo Logic", "d": "IDS on tactical networks and forensic logging on classified systems", "o": "Compliance audits (ISO 27001), hospitals, universities"}}, {"t": "Events of interest", "intro": "Incident detection starts by finding events of interest. Signals are either precursors (warnings) or indicators of compromise (attack likely in progress). Analytics must narrow millions of events to a number humans can review.", "nodes": [["E", "All events|millions per day", 60, 130], ["T", "Triage / filter|+ analytics", 215, 130], ["I", "Events of interest|about 10,000", 370, 130], ["N", "Analysts|about 200 per day", 520, 50], ["C", "Incident workflow", 520, 210]], "steps": [{"h": "Events flood in", "d": "Large public-facing systems create millions of events daily.", "f": "E", "to": "T", "p": "Millions"}, {"h": "Filter", "d": "Automated triage flags unusual items: unexpected shutdowns, new devices or regions, odd file movement, resource spikes, repeated door retries.", "f": "T", "to": "I", "p": "~10,000"}, {"h": "Reduce again", "d": "Further correlation cuts the list to about 200 that analysts can judge in near real time.", "f": "I", "to": "N", "p": "~200"}, {"h": "Decide", "d": "Most are benign (maintenance, support). An indicator of compromise goes to a managed incident workflow.", "f": "N", "to": "C", "p": "IoC"}], "pros": ["Focuses scarce analysts on likely attacks", "Covers IT, OT and physical signals"], "cons": ["Benign events can look suspicious", "Alert fatigue if filtering is poor"], "apps": {"c": "E-commerce fraud and order-abuse detection", "d": "Cyber watch floors triaging sensor alerts", "o": "Smart buildings, energy utilities, hospitals"}}, {"t": "IP flow (NetFlow)", "intro": "A router or switch fingerprints each forwarded packet using 5 to 7 attributes. NetFlow (Cisco) uses: source IP, destination IP, source port, destination port, layer 3 protocol, class of service and device interface. Packets with the same fingerprint form a flow.", "nodes": [["H", "Host A|source", 50, 130], ["R", "Router / switch|reads attributes", 210, 130], ["C", "Flow cache|packets + bytes", 370, 45], ["O", "Collector|analysis", 370, 215], ["D", "Destination", 540, 130]], "steps": [{"h": "Packet arrives", "d": "Host A sends a packet toward the destination.", "f": "H", "to": "R", "p": "Packet"}, {"h": "Fingerprint", "d": "The device records the seven attributes. A matching fingerprint joins an existing flow.", "f": "R", "to": "C", "p": "7 attrs"}, {"h": "Forward", "d": "The packet continues to its destination normally.", "f": "R", "to": "D", "p": "Packet"}, {"h": "Tally", "d": "The cache counts packets and bytes per flow, condensing huge traffic into a small database. That is why it scales.", "f": "C", "to": "C", "p": "Count"}, {"h": "Export and read", "d": "Analysts read origin, receiver, application (ports), priority (CoS), interface and volume to understand behaviour.", "f": "C", "to": "O", "p": "Flows"}], "pros": ["Scalable summary of huge traffic", "Shows who talks to whom, using what, how much", "Reveals baselines and anomalies"], "cons": ["No packet content", "Cannot see inside encrypted payloads", "Needs collectors and storage"], "apps": {"c": "ISP capacity planning and DDoS detection, enterprise traffic baselines", "d": "Network situational awareness and spotting data exfiltration", "o": "Campus networks, cloud providers, billing"}}, {"t": "Full packet capture", "intro": "Capture devices sit at ingress and egress points and record every packet crossing the border. Traffic is consolidated to few points using VPN tunnels and mandatory routing.", "nodes": [["I", "Internet", 50, 130], ["P", "Capture device|border tap", 220, 130], ["N", "Internal network", 400, 45], ["S", "Packet storage|huge capacity", 400, 215], ["A", "Analysis|IDS signatures", 545, 130]], "steps": [{"h": "Traffic arrives", "d": "All inbound and outbound packets are routed through the capture point.", "f": "I", "to": "P", "p": "All packets"}, {"h": "Pass through", "d": "Traffic continues to its destination in the network.", "f": "P", "to": "N", "p": "Forward"}, {"h": "Store raw data", "d": "Each packet is saved. Storage must cover your detection delay: knowing of a breach three months ago with one month of capture is useless.", "f": "P", "to": "S", "p": "Store"}, {"h": "Packet dump", "d": "Extract by IP, protocol or time, then analyze with tools or replay web traffic in a simulated browser.", "f": "S", "to": "A", "p": "Dump"}, {"h": "Use the findings", "d": "Evidence of conduct or attacks, and signatures for IDS/IPS, come from this analysis.", "f": "A", "to": "A", "p": "Evidence"}], "pros": ["Complete raw evidence for incident response", "Source for new IDS/IPS signatures"], "cons": ["Very high storage cost", "Not an IDS or IPS itself", "Cannot natively decrypt SSL/HTTPS", "Needs consolidated network design"], "apps": {"c": "Breach forensics at banks and telecoms (e.g. Wireshark, Arkime)", "d": "Forensics and threat-hunting on defense networks", "o": "HR conduct investigations, research networks"}}, {"t": "Risk monitoring and continuous monitoring", "intro": "Risk management is a never-ending cycle. Monitoring confirms controls work and supports near real-time detection. Monitoring is not trending: security analytics correlates many log entries to find the few suspicious ones. Monitoring also differs from auditing.", "nodes": [["R", "Risk response|controls in place", 70, 130], ["M", "Monitor|SIEM, tools", 230, 45], ["C", "Changes|assets, threats, laws", 230, 215], ["P", "Report|management, regulators", 400, 45], ["N", "New risk assessment", 530, 130]], "steps": [{"h": "Controls deployed", "d": "Risk response implements controls and leaves residual risk in the risk register.", "f": "R", "to": "M", "p": "Controls"}, {"h": "Watch for change", "d": "Track asset value, new threats, new vulnerabilities (and patches) and new legislation.", "f": "C", "to": "M", "p": "Changes"}, {"h": "Report", "d": "Results go to management, meet legal reporting duties and support audits.", "f": "M", "to": "P", "p": "Risk levels"}, {"h": "Trigger reassessment", "d": "Mergers, new processes, new laws, new threats or a schedule (such as every three years) start a new assessment.", "f": "P", "to": "N", "p": "Trigger"}, {"h": "Loop", "d": "The new assessment drives new or tuned controls, and the cycle repeats.", "f": "N", "to": "R", "p": "Update"}], "pros": ["Proves compliance (legal, regulatory, contractual)", "Catches new risk early", "Gives management clear evidence"], "cons": ["Continuous cost and skilled staff", "Tool noise and patch-testing burden"], "apps": {"c": "Splunk, Sumo Logic, SolarWinds for enterprise visibility", "d": "Continuous monitoring in government risk-management frameworks", "o": "Finance, health and cloud compliance programs"}}, {"t": "Evaluating control effectiveness", "intro": "Controls decay: users click through warnings or bypass them, attackers adapt, and software or business logic changes. Security professionals must prove protection is real, not an illusion.", "nodes": [["C", "Control|e.g. screen-lock policy", 60, 130], ["Q1", "1. Present?|policy exists", 210, 45], ["Q2", "2. Operating?|lock blocks access", 370, 45], ["Q3", "3. Reduces risk?|desired result", 520, 130], ["D", "Decay|bypass · change · new attacks", 300, 215]], "steps": [{"h": "Control installed", "d": "A control is put in place to mitigate a risk.", "f": "C", "to": "Q1", "p": "Check"}, {"h": "Is it present?", "d": "Confirm the control exists, such as a written policy.", "f": "Q1", "to": "Q2", "p": "Yes"}, {"h": "Is it operating?", "d": "Confirm it works in practice: does the locked screen stop access, and do users comply?", "f": "Q2", "to": "Q3", "p": "Test"}, {"h": "Does it cut risk?", "d": "Confirm the result: is the risk actually reduced?", "f": "Q3", "to": "D", "p": "Measure"}, {"h": "Decay found", "d": "Alert fatigue, bypasses and system changes erode the control, so it must be repaired, reconfigured or replaced.", "f": "D", "to": "C", "p": "Fix"}], "pros": ["Avoids a false sense of security", "Finds failing controls before attackers do"], "cons": ["Requires regular testing resources", "User compliance is hard to measure"], "apps": {"c": "SOX, ISO 27001 and PCI audits, red-team testing", "d": "Security control assessments and penetration tests", "o": "Hospitals, universities, public services"}}], "gloss": [["DLP", "Data Loss Prevention", "Controls keeping data under organizational control"], ["GDPR", "General Data Protection Regulation", "EU privacy law"], ["HIPAA", "Health Insurance Portability and Accountability Act", "US health-data law"], ["PCI DSS", "Payment Card Industry Data Security Standard", "Card-data security standard"], ["SSL", "Secure Sockets Layer", "Older encryption protocol for web traffic"], ["HTTP/HTTPS", "Hypertext Transfer Protocol (Secure)", "Web protocol"], ["SMTP", "Simple Mail Transfer Protocol", "Email sending protocol"], ["FTP", "File Transfer Protocol", "File transfer protocol"], ["IDS", "Intrusion Detection System", "Detects and alerts on attacks"], ["IPS", "Intrusion Prevention System", "Detects and blocks attacks"], ["SIEM", "Security Information and Event Management", "Collects and correlates logs"], ["NIST SP 800-92", "Guide to Computer Security Log Management", "Log-management guidance"], ["ISO 27001", "International standard for information security management", "Annex A.12.4 covers logging"], ["IT", "Information Technology", "Business computing systems"], ["OT", "Operational Technology", "Systems controlling physical processes"], ["IoT", "Internet of Things", "Networked physical devices"], ["IaaS", "Infrastructure as a Service", "Rented servers, storage, networks"], ["PaaS", "Platform as a Service", "Rented application platform"], ["SaaS", "Software as a Service", "Rented software"], ["UI", "User Interface", "How people interact with systems"], ["NetFlow", "Cisco network flow protocol", "Summarizes traffic into flows"], ["CoS", "Class of Service", "Traffic priority"], ["VPN", "Virtual Private Network", "Encrypted tunnel"], ["TP / FP", "True / False Positive", "Real attack vs harmless alert"], ["IoC", "Indicator of Compromise", "Signal an attack is likely underway"], ["CPU / GPU / RAM", "Central / Graphics Processing Unit, Random Access Memory", "System resources"], ["HVAC", "Heating, Ventilation and Air Conditioning", "Infrastructure that can signal events"], ["SOC", "Security Operations Center", "Team that monitors security"]]};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let m,n,si=0,tm,raf;
const nav=$('#nav');
D.mods.forEach((x,i)=>nav.insertAdjacentHTML('beforeend',`<button data-i="${i}">${x.t.split(':')[0].split(' (')[0]}</button>`));
nav.insertAdjacentHTML('beforeend','<button data-i="g">Glossary</button>');
nav.onclick=e=>{if(e.target.dataset.i)show(e.target.dataset.i)};
function stop(){clearInterval(tm);tm=0;const p=$('#play');if(p)p.textContent='▶ Play'}
function show(i){stop();$$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.i==i));
 $('#mod').hidden=i=='g';$('#gl').hidden=i!='g';if(i=='g'){gl('');return}
 m=D.mods[i];n=Object.fromEntries(m.nodes.map(a=>[a[0],a]));
 const li=a=>a.map(x=>`<li>${x}</li>`).join('');
 let sv='';m.steps.forEach(s=>{if(s.f!=s.to)sv+=`<line class="ln" x1="${n[s.f][2]}" y1="${n[s.f][3]}" x2="${n[s.to][2]}" y2="${n[s.to][3]}"/>`});
 m.nodes.forEach(a=>{const L=a[1].split('|');sv+=`<g class="nd" data-k="${a[0]}"><rect x="${a[2]-62}" y="${a[3]-22}" width="124" height="44" rx="8"/>`+L.map((t,j)=>`<text x="${a[2]}" y="${a[3]+(L.length>1?(j?10:-4):4)}" ${j?'style="fill:var(--mut)"':'style="font-weight:600"'}>${t}</text>`).join('')+'</g>'});
 $('#mod').innerHTML=`<h2>${m.t}</h2><p>${m.intro}</p><svg viewBox="0 0 600 260">${sv}<circle id="pk" r="8" cx="-20" cy="-20"/><text id="pt" x="-50" y="-50"></text></svg>
 <div class="ctl"><button id="prev">◀ Prev</button><button id="play" class="pri">▶ Play</button><button id="next">Next ▶</button></div><div id="say"></div>
 <h3 style="margin-top:10px">Working principle, step by step</h3>${m.steps.map((s,j)=>`<div class="st" data-j="${j}">${j+1}. ${s.h}</div>`).join('')}
 <div class="g"><div><h3>✅ Pros</h3><ul>${li(m.pros)}</ul></div><div><h3>⚠️ Cons</h3><ul>${li(m.cons)}</ul></div>
 <div><h3>🏢 Commercial</h3>${m.apps.c}</div><div><h3>🛡️ Defense</h3>${m.apps.d}</div><div><h3>🌍 Other domains</h3>${m.apps.o}</div></div>`;
 $('#prev').onclick=()=>{stop();go((si+m.steps.length-1)%m.steps.length)};
 $('#next').onclick=()=>{stop();go((si+1)%m.steps.length)};
 $('#play').onclick=()=>{if(tm){stop();return}$('#play').textContent='⏸ Pause';go((si+1)%m.steps.length);tm=setInterval(()=>go((si+1)%m.steps.length),3200)};
 $$('.st').forEach(e=>e.onclick=()=>{stop();go(+e.dataset.j)});go(0)}
function go(k){si=k;const s=m.steps[k],a=n[s.f],b=n[s.to],p=$('#pk'),t=$('#pt');
 $$('.st').forEach((e,j)=>e.classList.toggle('on',j==k));
 $('#say').innerHTML=`<b>Step ${k+1}: ${s.h}</b><br>${s.d}`;
 $$('.nd').forEach(e=>e.classList.toggle('hot',e.dataset.k==s.f||e.dataset.k==s.to));
 t.textContent=s.p;const t0=performance.now();cancelAnimationFrame(raf);
 (function f(t1){const u=Math.min(1,(t1-t0)/1400),x=a[2]+(b[2]-a[2])*u,y=a[3]+(b[3]-a[3])*u+(s.f==s.to?-26:0);
  p.setAttribute('cx',x);p.setAttribute('cy',y);t.setAttribute('x',x);t.setAttribute('y',y-13);if(u<1)raf=requestAnimationFrame(f)})(t0)}
function gl(f){$('#gt').innerHTML='<tr><th>Term</th><th>Full form</th><th>Meaning</th></tr>'+D.gloss.filter(r=>r.join(' ').toLowerCase().includes(f)).map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}
$('#q').oninput=e=>gl(e.target.value.toLowerCase());
show(0);
</script></body></html>
