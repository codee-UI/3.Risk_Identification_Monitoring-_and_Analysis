<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Security Assessment Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f5f4;--fg:#14232b;--mut:#5a6b73;--card:#fff;--line:#d3dcdf;--ac:#0b7a75;--bad:#c4501b;--ok:#2f8f4e;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e171c;--fg:#e4eceb;--mut:#92a5ab;--card:#16232a;--line:#2a3b44;--ac:#3fc5bc;--bad:#ff8a57;--ok:#6fd48c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e171c;--fg:#e4eceb;--mut:#92a5ab;--card:#16232a;--line:#2a3b44;--ac:#3fc5bc;--bad:#ff8a57;--ok:#6fd48c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Georgia,"Iowan Old Style",serif;margin:.2em 0}
header{padding:20px 16px 8px;max-width:1000px;margin:auto}header p{color:var(--mut);margin:.2em 0;max-width:70ch}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:1000px;margin:auto}
nav button,.ctl button{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;font:inherit;font-size:14px}
nav button[aria-pressed=true]{background:var(--ac);color:var(--bg);border-color:var(--ac)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
main{max-width:1000px;margin:auto;padding:8px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
canvas{width:100%;height:170px;display:block;background:var(--bg);border-radius:8px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.ctl span{color:var(--mut);font-size:14px}
.steps{list-style:none;padding:0;margin:0}.steps li{border-left:4px solid var(--line);padding:6px 10px;margin:6px 0;cursor:pointer}
.steps li.on{border-color:var(--ac);background:var(--bg)}.steps b{display:block}.steps small{color:var(--mut);font-size:14px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.pro h3{color:var(--ok)}.con h3{color:var(--bad)}ul{padding-left:20px;margin:.3em 0}
.table{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<header><h1>Security Assessment Lab</h1><p>Watch each concept run step by step: host hardening, IDS/IPS testing, wireless testing, penetration testing, SOC reports and audit communication. Pick a topic, press Play, or click any step.</p></header>
<nav id="nav" aria-label="Topics"></nav><main id="main"></main>
<script>
const D={"topics":[{"id":"host","n":"Host scanning","sum":"Hardening a host so it offers only the services its role needs, then scanning to prove it.","steps":[["Define the host’s role","Policy states what this host must do (e.g. web server) and nothing more.","policy"],["Disable unneeded services","Remove or stop anything not critical to the role; unused software is forgotten and unpatched.","svc off"],["Disable insecure services","Replace legacy tools built for private LANs (Telnet, FTP, rlogin) with secure alternatives.","telnet✗"],["Port-map the host","Scanners use many techniques to list open ports and services.","SYN"],["Compare with policy","Any service found that policy doesn’t list is a finding to remove or justify.","diff"],["Patch, document, re-scan","Secure today is not secure tomorrow: repeat after every change.","patch"]],"pros":["Smaller attack surface","Cheap, repeatable, automatable","Finds forgotten software"],"cons":["Only a point-in-time snapshot","Scans can disturb fragile systems","Needs accurate policy baseline"],"apps":[["Commercial","CIS Benchmarks hardening, Nessus / Qualys / OpenVAS scans for PCI DSS"],["Defense","DISA STIG hardening and continuous scanning of military servers"],["Other","Cloud golden images, hospital and utility servers"]]},{"id":"ids","n":"IDS / IPS traffic testing","sum":"Test whether the monitoring system catches every traffic type an attacker might use.","steps":[["Single-packet patterns","Minimum function: search one packet for an exploit signature.","1 pkt"],["Multi-packet (stateful) patterns","IDS remembers and reassembles packets, then inspects the combined payload.","p1+p2"],["Obfuscated data","Payload converted ASCII↔hex↔Unicode; IDS must normalise it back to match signatures.","0x41"],["Fragmented data","IP fragments and overlapping fragments (teardrop) are reassembled as the target would.","frag"],["Protocol-embedded attacks","Decode DNS, SSL, HTTP, FTP, SQL like a host to find exploits inside application data.","HTTP"],["Flooding detection","Threshold alerts, e.g. over 10 half-open connections in 2 s to one host (DoS).","SYN×10"],["IPS monitoring","IPS sits inline and acts (blocks); IDS only reports. Risk: good traffic rejected.","block"],["Security gateway testing","Proxies and gateways apply policy rules, antivirus and Java/ActiveX filters.","filter"]],"pros":["Detects known exploit patterns","IPS stops attacks in real time","Gives forensic logs"],"cons":["False positives and false negatives","Evasion by fragmentation or encoding","Inline IPS can block legitimate traffic and complicate troubleshooting"],"apps":[["Commercial","Snort, Suricata, Cisco Firepower, Palo Alto next-gen firewalls at banks and data centres"],["Defense","Government gateway sensors such as CISA EINSTEIN; military network boundaries"],["Other","Universities, ISPs, industrial plants (Zeek monitoring)"]]},{"id":"wifi","n":"Wireless testing","sum":"Finding rogue access points and checking that authorised ones are encrypted and authenticated.","steps":[["Understand the risk","One unsecured AP is like a network port in the parking lot.","AP"],["Scan wired side","Vulnerability scanner looks for AP-vendor MAC addresses and HTTP management pages.","MAC"],["Walk the RF spectrum","Handheld scanner finds SSIDs and MACs not owned by the company, across all bands (a/b/g/n).","SSID"],["Automatic detection","Authorised APs and clients report rogue RF; a switch port can be shut automatically.","alert"],["Lock down the switch","MAC filtering ties each port to a known MAC so unapproved devices can’t join.","port"],["Test authorised APs","Require encryption, 802.1X authentication, SSID naming, and L2/L3/L4 filters.","WPA"],["Know attacker methods","War driving, war dialing (old modems, ICS/SCADA) and war flying (drones).","drive"]],"pros":["Reveals hidden entry points","Tools are cheap (Kismet, NetStumbler)","Supports automatic port shutdown"],"cons":["Periodic walks leave gaps between scans","Must cover every band and standard","Legacy WEP/WPA-PSK can be cracked (Aircrack-ng)"],"apps":[["Commercial","Cisco, Aruba and Mist wireless intrusion prevention in retail, offices, hospitals"],["Defense","Wireless-free zones and drone/RF sweeps at secure facilities"],["Other","Airports, campuses, PCI DSS wireless scans"]]},{"id":"modes","n":"Pen-test modes & ethics","sum":"Ethical penetration testing is contractual: signed RoE, authorisation and confidentiality.","steps":[["Rules of engagement","Signed contract defines scope, methods, liability; without it a tester risks criminal and civil liability.","RoE"],["Zero knowledge (opaque box)","Outsider with only public information: most realistic, most expensive.","OSINT"],["Partial knowledge","Client shares IPs, network layouts, SSIDs: the most common test.","IPs"],["Full knowledge (transparent box)","Internal team knows everything; finds weaknesses before attackers do.","all"],["Blind test","IT staff don’t know; measures detection and response.","?"],["Double-blind test","Neither IT nor security knows; tests the incident management program.","??"],["Red teaming & bug bounty","Aggressive, TTP-based simulation; bounty hunters stay ethical by following program terms and disclosing only to the owner.","TTP"]],"pros":["Proves whether controls work in practice","Exercises detection and response","Compliance frameworks recognise it"],"cons":["Zero-knowledge tests are costly and need skilled testers","Can disrupt operations","Scope limits may miss other problems"],"apps":[["Commercial","Banks under TIBER-EU / CBEST red-team schemes; HackerOne and Bugcrowd bounties"],["Defense","Military and government red teams (e.g. DoD Red Teams)"],["Other","Healthcare, SaaS, automotive and IoT product testing"]]},{"id":"five","n":"Five phases of pen testing","sum":"A rigorous methodology that directly affects risk assessment of the test itself.","steps":[["1. Chartering / scoping","RoE drafted: scope, methods, constraints, authorisers, incident reporting, legal limits.","RoE"],["2. Discovery","Reconnaissance maps systems in scope (skipped if RoE names exact targets).","recon"],["3. Scanning","Find weaknesses and fingerprint systems so exploits can be crafted.","scan"],["4. Exploitation","Deliver exploit, document the compromise, and withdraw without leaving a new hole.","exploit"],["5. Reporting","Executive summary and recommendations; return all materials, including captured credentials.","report"]],"pros":["Repeatable, auditable process","Limits damage through the RoE","Produces actionable recommendations"],"cons":["No single standard (OSSTMM, NIST SP 800-115, PTES differ)","Methodology must be documented in the RoE","Exploitation always carries real risk"],"apps":[["Commercial","Metasploit, Burp Suite, Nmap used by consultancies for ISO 27001 / PCI DSS pen tests"],["Defense","Accreditation testing of weapon-system and mission networks"],["Other","Critical infrastructure, e-government portals"]]},{"id":"soc","n":"SOC reports","sum":"AICPA attestation reports (SSAE 18/20) about a service organisation’s controls.","steps":[["SOC 1","Controls over financial reporting (ICFR).","ICFR"],["Type I vs Type II","Type I: design at a point in time. Type II: operating effectiveness over a period (6+ months, usually annual).","I|II"],["SOC 2","Trust Services Criteria: Security, Availability, Confidentiality, Processing Integrity, Privacy.","TSC"],["SOC 3","Public, less technical summary of a SOC 2.","public"],["SOC for Cybersecurity","Evaluates the cybersecurity risk-management program using the criteria.","cyber"]],"pros":["Builds customer trust","One report answers many vendor questionnaires","Type II shows ongoing due diligence"],"cons":["Costly and time-consuming","Reports are point-in-time or period-limited","SOC 1/2 are restricted-use documents"],"apps":[["Commercial","AWS, Microsoft Azure, Salesforce and payroll providers publish SOC 1/2/3"],["Defense","Contractors supporting government outsourcing show SOC 2 alongside FedRAMP"],["Other","Hospitals’ cloud vendors, fintech and SaaS start-ups"]]},{"id":"audit","n":"Compliance & communicating findings","sum":"Compliance is built into every life-cycle step; audit results are reported to leadership.","steps":[["Adopt a standard","Compliance starts by accepting a standard for how the business operates.","std"],["Embed in life cycle","Applied to development, use, maintenance, disposal, training and evaluation.","SDLC"],["Audit draft","Draft report to management: scope, objective, findings, recommendations.","draft"],["Management response","Fix errors, plan and schedule actions, or record disagreement.","reply"],["Record fixed issues","Even issues fixed before the final report are logged so auditors can confirm they stay fixed.","log"],["Final report","Executive summary for senior managers and the board audit committee; detailed report for those fixing findings.","final"],["Feed back to monitoring","Leaders may ask for more frequent or detailed monitoring.","KPI"]],"pros":["Meets laws and regulator expectations","Keeps leadership informed of risk","Creates accountability"],"cons":["Adds cost","Risk of checkbox compliance","Findings can go stale if not followed up"],"apps":[["Commercial","SOX, PCI DSS and ISO 27001 audits"],["Defense","FISMA / RMF authorisation and continuous monitoring"],["Other","HIPAA in healthcare, GDPR in privacy programs"]]}],"gloss":[["AICPA","American Institute of Certified Public Accountants"],["AP","Access Point"],["ASCII","American Standard Code for Information Interchange"],["CIANA+PS","Confidentiality, Integrity, Availability, Nonrepudiation, Authentication + Privacy, Safety"],["DNS","Domain Name System"],["DoS","Denial of Service"],["FMS","Fluhrer, Mantin, Shamir (WEP attack)"],["FTP","File Transfer Protocol"],["HTTP","HyperText Transfer Protocol"],["ICFR","Internal Controls over Financial Reporting"],["ICS","Industrial Control Systems"],["IDS","Intrusion Detection System"],["IP","Internet Protocol"],["IPS","Intrusion Prevention System"],["LAN","Local Area Network"],["MAC","Media Access Control (address)"],["PTW","Pyshkin, Tews, Weinmann (WEP attack)"],["RF","Radio Frequency"],["RoE","Rules of Engagement"],["SCADA","Supervisory Control and Data Acquisition"],["SOC","System and Organization Controls"],["SQL","Structured Query Language"],["SSAE","Statement on Standards for Attestation Engagements"],["SSID","Service Set Identifier (Wi-Fi network name)"],["SSL","Secure Sockets Layer"],["TSC","Trust Services Criteria"],["TTP","Tactics, Techniques and Procedures"],["VoIP","Voice over Internet Protocol"],["WAP","Wireless Access Point"],["WEP","Wired Equivalent Privacy"],["WPA-PSK","Wi-Fi Protected Access, Pre-Shared Key"],["802.1X","IEEE port-based network access authentication"]]};let cur=0,step=0,play=true,pk=[],last=0,tick=0,tm=0;
const nav=document.getElementById("nav"),main=document.getElementById("main");
function mkNav(){nav.innerHTML="";D.topics.forEach((t,i)=>{nav.append(btn(t.n,()=>{cur=i;step=0;render()},i===cur))});nav.append(btn("Glossary",()=>{cur=-1;render()},cur===-1))}
function btn(t,f,p){const b=document.createElement("button");b.textContent=t;b.onclick=f;if(p!==undefined)b.setAttribute("aria-pressed",p);return b}
function esc(s){return s.replace(/[&<]/g,c=>c=="&"?"&amp;":"&lt;")}
function render(){mkNav();if(cur===-1){main.innerHTML='<div class="card"><h2>Terminology: full forms</h2><input id="q" placeholder="Search a term, e.g. IPS" aria-label="Search terms"><div class="table"><table id="gt"></table></div></div>';const q=document.getElementById("q");const f=()=>{document.getElementById("gt").innerHTML=D.gloss.filter(g=>(g[0]+g[1]).toLowerCase().includes(q.value.toLowerCase())).map(g=>"<tr><th>"+esc(g[0])+"</th><td>"+esc(g[1])+"</td></tr>").join("")};q.oninput=f;f();return}
const t=D.topics[cur];
main.innerHTML='<div class="card"><h2>'+esc(t.n)+'</h2><p>'+esc(t.sum)+'</p><canvas id="cv" role="img" aria-label="Animated simulation of '+esc(t.n)+'"></canvas><div class="ctl"><button id="pp"></button><button id="pv">Back</button><button id="nx">Next</button><span id="cap"></span></div></div><div class="card"><h3>Working principle, step by step</h3><ol class="steps" id="st"></ol></div><div class="g"><div class="card pro"><h3>Pros</h3><ul>'+t.pros.map(x=>"<li>"+esc(x)+"</li>").join("")+'</ul></div><div class="card con"><h3>Cons</h3><ul>'+t.cons.map(x=>"<li>"+esc(x)+"</li>").join("")+'</ul></div></div><div class="card"><h3>Where it is deployed</h3><div class="table"><table>'+t.apps.map(a=>"<tr><th>"+a[0]+"</th><td>"+esc(a[1])+"</td></tr>").join("")+'</table></div></div>';
const st=document.getElementById("st");t.steps.forEach((s,i)=>{const l=document.createElement("li");l.innerHTML="<b>"+esc(s[0])+"</b><small>"+esc(s[1])+"</small>";l.onclick=()=>{step=i;play=false;sync()};st.append(l)});
document.getElementById("pp").onclick=()=>{play=!play;sync()};document.getElementById("pv").onclick=()=>{step=(step+t.steps.length-1)%t.steps.length;play=false;sync()};document.getElementById("nx").onclick=()=>{step=(step+1)%t.steps.length;sync()};sync();pk=[]}
function sync(){if(cur<0)return;const t=D.topics[cur];document.getElementById("pp").textContent=play?"Pause":"Play";document.getElementById("cap").textContent="Step "+(step+1)+" of "+t.steps.length+": "+t.steps[step][0];[...document.getElementById("st").children].forEach((l,i)=>l.classList.toggle("on",i===step))}
const C=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function frame(ts){requestAnimationFrame(frame);if(cur<0)return;const cv=document.getElementById("cv");if(!cv)return;const dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==w*dpr){cv.width=w*dpr;cv.height=h*dpr}
const x=cv.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);const dt=Math.min(ts-last,50);last=ts;const t=D.topics[cur],s=t.steps[step];
if(play){tm+=dt;if(tm>4500){tm=0;step=(step+1)%t.steps.length;sync()}}
tick+=dt;if(tick>700){tick=0;pk.push({x:0,bad:Math.random()<.35,a:1,dead:false})}
const mid=w/2,fg=C("--fg"),ac=C("--ac"),bad=C("--bad"),ok=C("--ok"),mut=C("--mut");
x.strokeStyle=C("--line");x.lineWidth=2;x.beginPath();x.moveTo(0,h/2);x.lineTo(w,h/2);x.stroke();
x.fillStyle=ac;x.globalAlpha=.15;x.fillRect(mid-70,18,140,h-36);x.globalAlpha=1;x.strokeStyle=ac;x.strokeRect(mid-70,18,140,h-36);
x.fillStyle=fg;x.font="600 13px system-ui";x.textAlign="center";x.fillText(s[0].replace(/^\d\. /,"").slice(0,22),mid,36);x.font="12px system-ui";x.fillStyle=mut;x.fillText(cur>=0&&["ids","wifi"].includes(t.id)?"inspector":"checkpoint",mid,h-26);
x.font="11px system-ui";pk.forEach(p=>{if(play||true)p.x+=dt*.09;if(!p.dead&&p.bad&&p.x>mid-80){p.dead=true}if(p.dead)p.a-=dt/500;const y=h/2+(p.dead?(p.x-mid)*.4:0);x.globalAlpha=Math.max(p.a,0);x.fillStyle=p.bad?bad:(p.x>mid+70?ok:fg);x.fillRect(p.x-22,y-11,44,22);x.fillStyle=C("--bg");x.fillText(s[2],p.x,y+4)});
x.globalAlpha=1;pk=pk.filter(p=>p.x<w+30&&p.a>0);x.textAlign="left";x.fillStyle=bad;x.font="12px system-ui";x.fillText("● suspect",8,h-8);x.fillStyle=ok;x.fillText("● cleared",80,h-8)}
render();requestAnimationFrame(frame);
</script></body></html>
