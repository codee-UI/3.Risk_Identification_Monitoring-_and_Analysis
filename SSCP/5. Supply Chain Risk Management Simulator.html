<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Supply Chain Risk Management Simulator</title>
<style>
:root{--bg:#f1f5f7;--card:#fff;--ink:#14232e;--mute:#53656f;--line:#cfdbe2;--acc:#0f766e;--acc2:#b45309;--tok:#e11d48;--good:#166534;--bad:#9f1239;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e171d;--card:#16232c;--ink:#e6eef3;--mute:#9db0bc;--line:#2a3b46;--acc:#2dd4bf;--acc2:#fbbf24;--tok:#fb7185;--good:#86efac;--bad:#fda4af}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 48px}h1,h2{font-family:Georgia,serif;line-height:1.2}h1{font-size:1.7rem;margin:.2em 0}h2{font-size:1.35rem;margin:.3em 0}h3{font-size:1rem;margin:0 0 .4em}
p.lead{color:var(--mute);max-width:70ch;margin:0 0 14px}
#tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}#tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:20px;font:inherit;font-size:.9rem;cursor:pointer}#tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:14px}
.sim{position:relative;aspect-ratio:10/7;width:100%;max-width:680px;margin:0 auto}.sim svg{position:absolute;inset:0;width:100%;height:100%}
.nd{position:absolute;transform:translate(-50%,-50%);width:28%;min-height:40px;padding:6px;border:2px solid var(--line);background:var(--card);border-radius:8px;font-size:clamp(10px,2.3vw,13px);line-height:1.25;text-align:center;cursor:pointer;color:var(--ink);transition:border-color .3s,background .3s}
.nd.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,var(--card));font-weight:600}.nd.done{border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}
.hub{border-radius:50%;width:24%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--acc);color:#fff;border-color:var(--acc);cursor:default;transition:transform .4s}.hub.pulse{transform:translate(-50%,-50%) scale(1.12)}
.tok{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--tok);box-shadow:0 0 0 5px color-mix(in srgb,var(--tok) 30%,transparent);transition:left .8s ease,top .8s ease;pointer-events:none}
.bar{position:absolute;height:14px;border-radius:7px;background:var(--acc);transform:translateY(-50%);transition:width .8s;font-size:0}.bl{position:absolute;transform:translateY(-50%);font-size:12px;color:var(--mute)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.ctl button,.dm button{border:1px solid var(--acc);background:var(--card);color:var(--acc);padding:7px 14px;border-radius:6px;font:inherit;cursor:pointer}.ctl button.p{background:var(--acc);color:#fff}
#info{min-height:5.5em;border-left:4px solid var(--acc);padding:4px 12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.pro h3{color:var(--good)}.con h3{color:var(--bad)}ul{margin:0;padding-left:1.1em}li{margin:.2em 0}
.dm code{display:block;padding:8px;background:var(--bg);border-radius:6px;overflow-wrap:anywhere;margin:6px 0}#vr.ok{color:var(--good)}#vr.no{color:var(--bad)}
input#q{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.tw{overflow-x:auto;margin-top:10px}table{border-collapse:collapse;width:100%;min-width:560px;font-size:.9rem}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
@media(prefers-reduced-motion:reduce){.tok,.bar,.nd,.hub{transition:none}}
</style></head><body><main>
<h1>Software Supply Chain & Risk Management Simulator</h1>
<p class="lead">Pick a topic, press Play, and watch the red token move through each step. Click any box to jump to it. Full forms of every abbreviation are in the glossary at the bottom.</p>
<div id="tabs" role="tablist"></div><div id="app"></div>
<section class="card"><h2>Glossary: full forms</h2><input id="q" placeholder="Filter terms (e.g. SIEM, NIST)" aria-label="Filter glossary"><div class="tw"><table><thead><tr><th>Term</th><th>Full form</th><th>Meaning</th></tr></thead><tbody id="gl"></tbody></table></div></section>
</main>
<script>
const D={"mods":[{"tab":"ERM","title":"Enterprise Risk Management (ERM)","type":"hub","hub":"Enterprise Risk Management","sum":"Risk is handled as part of strategy, not as a separate chore. Five concerns feed one ERM process (COSO model; ISO 31000 is the companion standard).","nodes":[{"n":"Mission, Vision & Core Values","d":"Define what the organization stands for. This shows what is worth protecting and how much risk it will accept."},{"n":"Strategy Development","d":"Choose a strategy and check the risks each option adds against the organization's risk appetite."},{"n":"Business Objective Formulation","d":"Turn strategy into measurable goals. Each goal gets its own risks identified."},{"n":"Implementation & Performance","d":"Run the plan: identify, assess, prioritize and respond to risks, then track results against targets."},{"n":"Enhanced Value","d":"Review and report. Feedback improves later decisions and creates value for stakeholders."}],"pros":["Ties risk directly to strategy and goals","Common risk language across departments","Supports internal controls and audits"],"cons":["Heavy documentation and effort","Needs strong executive sponsorship","Generic; must be tailored to each organization"],"apps":{"Commercial":"Banks and insurers (enterprise risk, internal-control reporting), manufacturers, retailers.","Defense":"Defense contractors aligning program risk with contract objectives; ministries using ISO 31000-style risk policy.","Other":"Hospitals, universities, public agencies, NGOs."}},{"tab":"Risk reviews","title":"Risk Review Types","type":"hub","hub":"Risk review","sum":"Reviews find and reduce threats in three areas. The framework is the 'how'; the same four questions apply to all of them.","nodes":[{"n":"Internal review","d":"Checks internal controls and processes. Frameworks: COSO ERM (2004, 5 phases, 20 principles) and ISO 31000 (2009). Inputs: audit reports, financial statements, compliance documents, risk policies, risk registers. Outputs: Risk Assessment Reports, control-effectiveness reports, action plans, treatment plans, monitoring schedules."},{"n":"Supplier review","d":"Assesses third-party vendor risk. Frameworks: NIST SP 800-161 (supply chain risk) and ISO/IEC 27036 (4 parts, incl. cloud). Inputs: supplier security assessments, contracts, compliance checklists. Outputs: risk reports, plans, compliance certificates."},{"n":"Architecture review (ARR)","d":"Finds security risk in IT design, implementation and maintenance. Uses NIST SP 800-53 controls, OWASP tools (Top 10, ZAP, SAMM), TOGAF (aligns IT with business) and ISO/IEC 27001. Outputs: security improvement plans, compliance reports."},{"n":"Common method: why, who, what, where","d":"Why: set context and purpose. Who: identify stakeholders. What: scan, assess, document. Where: implement controls and monitor continuously."}],"pros":["Structured, repeatable assessments","Produces evidence for auditors and regulators","Covers people, vendors and technology"],"cons":["Many overlapping frameworks to choose from","Point-in-time unless monitoring is continuous","Quality depends on input data and assessor skill"],"apps":{"Commercial":"Finance and cloud providers run vendor reviews and OWASP-based application testing; enterprises use TOGAF/ISO 27001.","Defense":"Federal and defense programs apply NIST SP 800-53 and 800-161 to systems and suppliers.","Other":"Healthcare, energy and government agencies for regulatory compliance."}},{"tab":"Supply chain","title":"Software Supply Chain Risk Management","type":"ladder","sum":"Software comes through layers of suppliers. Lower down, you control less and see fewer known vulnerabilities (CVE data covers popular products, not your custom code). Trust bars are illustrative.","nodes":[{"n":"Hardware & systems vendors","t":95,"d":"Firmware and platforms from major vendors. Usually robust, trustworthy integrity and security processes."},{"n":"Application software providers","t":85,"d":"Large vendors (COTS software) with secure, reliable update and support processes."},{"n":"Third-party developers","t":70,"d":"Custom or tailored software. Engage only if both sides agree how security will be provided and assessed."},{"n":"In-house developers","t":65,"d":"Formal QA, configuration management and security assessment give as much control as the organization funds."},{"n":"Open-source providers","t":35,"d":"Support ranges from good to none; updates may not be digitally signed or verifiable."},{"n":"Citizen programmers","t":15,"d":"Staff-written scripts and macros, often adapted from the internet. Powerful but hard to manage, verify or assess."}],"pros":["Layered view shows where to focus controls","COTS and in-house code can be tightly governed","Open source and citizen code give flexibility and speed"],"cons":["Visibility drops toward the bottom layers","Custom code may be unknown to CVE databases","Citizen code often skips security requirements"],"apps":{"Commercial":"Software vendors and enterprises track component origin (often with an SBOM, a list of components).","Defense":"Defense procurement vets suppliers and component provenance for mission systems.","Other":"Hospitals and utilities review vendor and open-source risk for critical systems."}},{"tab":"Source systems","title":"Source Systems for Risk Data","type":"hub","hub":"Risk assessment","sum":"Any system that data passes through is in scope. Data from four categories shows risk level and exposure.","nodes":[{"n":"Applications","d":"SaaS email, CRM and ERP systems used to run the business."},{"n":"Security appliances","d":"Firewalls, IDS/IPS and SIEM devices (hardware or virtual) giving protection, visibility and monitoring."},{"n":"Network devices","d":"Routers, switches and access points that connect systems and networks, inside and outside."},{"n":"Hosts","d":"Workstations and mobile devices. They hold sensitive data and are common entry points to the network."}],"pros":["Wide coverage gives a fuller risk picture","Logs and telemetry support evidence-based decisions"],"cons":["Large data volume needs automation","Gaps in any category create blind spots"],"apps":{"Commercial":"Security operations centers feed SIEM tools with logs from all four categories.","Defense":"Cyber commands correlate network, host and appliance data for situational awareness.","Other":"Universities and city governments monitor endpoints and networks the same way."}},{"tab":"Secure software","title":"Software Supply Chain Controls","type":"cycle","demo":1,"sum":"Controls that protect what you install, build and buy. Try the code-signing demo below the steps.","nodes":[{"n":"Mobile code","d":"Code that arrives from outside, whose development you cannot see or influence. Least trustworthy; filter it with antimalware, antivirus and intrusion detection."},{"n":"Code signing","d":"The package is hashed and the hash is signed with a private key (public-key algorithm). Receivers verify with the certificate. Do not install unsigned or unverifiable software."},{"n":"Shadow IT","d":"Hardware or software bought outside IT, usually without security review. Check licensing and how patches will interact. Gartner estimated about 35% of IT spend in 2020."},{"n":"Software restriction policies (SRP)","d":"Policy plus a technical block that stops unknown software from running, even for administrators. Path-based rules cover executables and libraries with little performance cost."},{"n":"Escrow","d":"A trusted third party holds the vendor's source code, released to the buyer only if the vendor fails (bankruptcy, ends support)."},{"n":"Code ownership","d":"Source code and documentation are intellectual property. The contract must say who owns the finished product."},{"n":"Licensing","d":"Use software only as licensed (type and number of licenses, per the EULA). Breaches can bring fines or criminal charges."}],"pros":["Blocks tampered and unapproved software","Protects continuity if a vendor fails","Reduces legal and compliance exposure"],"cons":["Signing needs key and certificate management","Strict SRP can slow legitimate work","Escrow and contracts add cost and negotiation"],"apps":{"Commercial":"OS and app updates are signed; enterprises use application allow-listing; escrow for critical vendor software.","Defense":"Signed, allow-listed software on controlled systems; source escrow for long-life programs.","Other":"Banks, hospitals and app stores require signed code."}},{"tab":"Vulnerability cycle","title":"Vulnerability Management Life Cycle","type":"cycle","sum":"An exploited vulnerability existed before the attack; the defenders just did not know. The cycle finds, records and fixes them continuously.","nodes":[{"n":"Scan","d":"Automated tools scan networks, web apps, databases, endpoints, on-premises and cloud. Any change can trigger a rescan."},{"n":"Analyze & assess","d":"Experts judge which findings could cause a serious risk event. When in doubt, add it to the risk register until ruled out."},{"n":"Track","d":"Record every candidate in the tracking system. Keep suspected items; storage is cheap compared with a missed risk."},{"n":"Align to risks","d":"Link each vulnerability to an existing risk, or carry it unaligned until analysis finishes."},{"n":"Prioritize","d":"Leadership ranks risks by organizational goals, so aligned vulnerabilities inherit that priority. New risks get further assessment."},{"n":"Treat","d":"Schedule and complete fixes, then validate (often by testing). Then scan again."}],"pros":["Continuous, repeatable process","Priorities follow business risk, not just severity scores","Validation proves fixes worked"],"cons":["Scan results need expert analysis","False positives consume time","Hard to manage at scale without automation"],"apps":{"Commercial":"Enterprises and cloud providers run scheduled scans and patch cycles; regulated sectors such as payments require them.","Defense":"Mission networks run continuous scanning and risk-based patching.","Other":"Hospitals, utilities and universities patch by risk priority."}}],"gl":[["COSO","Committee of Sponsoring Organizations of the Treadway Commission","Body behind the ERM framework focused on internal controls"],["ERM","Enterprise Risk Management","Managing risk across the whole organization, linked to strategy"],["ISO","International Organization for Standardization","Publisher of international standards"],["ISO 31000","ISO risk management standard","Guidelines for understanding and treating enterprise risk"],["RAR","Risk Assessment Report","Management-facing result of a risk review"],["ARR","Architecture Risk Review","Review of IT architecture for security risk"],["NIST","National Institute of Standards and Technology","US agency publishing security guidance"],["SP 800-161","Special Publication 800-161","NIST guide to supply chain risk management"],["SP 800-53","Special Publication 800-53","NIST catalog of security and privacy controls"],["OWASP","Open Web Application Security Project","Nonprofit for software security; free tools"],["ZAP","Zed Attack Proxy","OWASP tool that tests web apps for flaws"],["SAMM","Software Assurance Maturity Model","OWASP model to measure and improve software security"],["TOGAF","The Open Group Architecture Framework","Aligns IT architecture with business goals"],["ISO/IEC 27001","Information security management system standard","Requirements for an ISMS; suits larger enterprises"],["ISO/IEC 27036","Information security for supplier relationships","Four-part standard incl. cloud services"],["ISMS","Information Security Management System","Policies and processes that manage information security"],["SCRM","Supply Chain Risk Management","Finding and reducing risk from suppliers and components"],["COTS","Commercial Off-The-Shelf","Ready-made software bought from vendors"],["CVE","Common Vulnerabilities and Exposures","Public catalog of known vulnerabilities"],["SBOM","Software Bill of Materials","List of components inside software (outside source text)"],["SOHO","Small Office / Home Office","Smallest environment type, still needs tracking"],["SRP","Software Restriction Policy","Rules that block unapproved software from running"],["EULA","End-User License Agreement","Contract stating allowed use of software"],["SaaS","Software as a Service","Cloud-delivered application"],["CRM","Customer Relationship Management","System for managing customer data"],["ERP","Enterprise Resource Planning","Software integrating core business processes"],["IDS/IPS","Intrusion Detection / Prevention System","Detects (and blocks) malicious activity"],["SIEM","Security Information and Event Management","Collects and correlates security logs and alerts"],["Shadow IT","Unsanctioned IT","Tech acquired without IT department knowledge"],["Escrow","Third-party custody","Source code held by a neutral party for the buyer's protection"],["Risk register","Risk register","Database of identified risks and linked vulnerabilities"]]};
const $=s=>document.querySelector(s);let cur=0,st=-1,timer=null,hubN=0;
const tabs=$('#tabs');D.mods.forEach((m,i)=>{const b=document.createElement('button');b.textContent=m.tab;b.onclick=()=>sel(i);tabs.append(b)});
function pos(m,i){const n=m.nodes.length;if(m.type==='ladder')return[100,36+i*(348/(n-1))];const a=-Math.PI/2+i*2*Math.PI/n;return[300+215*Math.cos(a),210+150*Math.sin(a)]}
const px=([x,y])=>'left:'+x/6+'%;top:'+y/4.2+'%';
function sel(i){stop();cur=i;st=-1;hubN=0;[...tabs.children].forEach((b,j)=>b.classList.toggle('on',i==j));render()}
function render(){const m=D.mods[cur],n=m.nodes.length;let h='<div class="card"><h2>'+m.title+'</h2><p class="lead">'+m.sum+'</p><div class="sim" id="sim"><svg viewBox="0 0 600 420" preserveAspectRatio="none" aria-hidden="true">';
if(m.type==='cycle')h+='<ellipse cx="300" cy="210" rx="215" ry="150" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="8 6"/>';
if(m.type==='hub')m.nodes.forEach((_,i)=>{const[x,y]=pos(m,i);h+='<line x1="'+x+'" y1="'+y+'" x2="300" y2="210" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"/>'});
h+='</svg>';
if(m.type==='hub')h+='<div class="nd hub" id="hub" style="'+px([300,210])+'">'+m.hub+'</div>';
m.nodes.forEach((o,i)=>{h+='<button class="nd" data-i="'+i+'" style="'+px(pos(m,i))+'">'+o.n+'</button>';if(m.type==='ladder')h+='<div class="bar" id="b'+i+'" style="left:'+(230/6)+'%;top:'+pos(m,i)[1]/4.2+'%;width:0"></div><div class="bl" id="l'+i+'" style="left:'+(240/6)+'%;top:'+pos(m,i)[1]/4.2+'%"></div>'});
h+='<div class="tok" id="tok" style="'+px(m.type==='hub'?[300,210]:pos(m,0))+'"></div></div><div class="ctl"><button id="pv">Previous</button><button class="p" id="pl">Play</button><button id="nx">Next</button><button id="rs">Reset</button></div><div id="info" aria-live="polite">Press Play or Next to begin.</div></div>';
if(m.demo)h+='<div class="card dm"><h3>Code-signing demo (toy hash; real systems use SHA-256 and a private key)</h3><code id="pk">app-v1.0 payload</code><button id="sg">1. Sign package</button> <button id="tm">2. Tamper with it</button> <button id="vf">3. Verify</button><p id="vr" aria-live="polite">Sign the package first.</p></div>';
h+='<div class="cols"><div class="card pro"><h3>Pros</h3><ul>'+m.pros.map(x=>'<li>'+x+'</li>').join('')+'</ul></div><div class="card con"><h3>Cons</h3><ul>'+m.cons.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></div><div class="card"><h3>Where it is used</h3><div class="cols">'+Object.entries(m.apps).map(([k,v])=>'<div><b>'+k+'</b><br>'+v+'</div>').join('')+'</div></div>';
$('#app').innerHTML=h;
document.querySelectorAll('.nd[data-i]').forEach(b=>b.onclick=()=>{stop();go(+b.dataset.i)});
$('#pv').onclick=()=>{stop();go((st-1+n)%n)};$('#nx').onclick=()=>{stop();go((st+1)%n)};$('#rs').onclick=()=>sel(cur);$('#pl').onclick=play;
if(m.demo){let sig=null,pkg='app-v1.0 payload';const hs=s=>{let x=5381;for(const c of s)x=((x*33)^c.charCodeAt(0))>>>0;return x.toString(16)},o=$('#vr'),s=()=>$('#pk').textContent=pkg;
$('#sg').onclick=()=>{sig=hs(pkg);o.className='';o.textContent='Signed. Signature (hash): '+sig};
$('#tm').onclick=()=>{pkg+=' +malware';s();o.className='';o.textContent='Package changed after signing.'};
$('#vf').onclick=()=>{if(!sig){o.textContent='Sign the package first.';return}const ok=hs(pkg)===sig;o.className=ok?'ok':'no';o.textContent=ok?'Signature valid: package is unchanged.':'Signature INVALID: package was altered. Do not install.'}}}
function go(i){const m=D.mods[cur],n=m.nodes.length;st=i;const tk=$('#tok');
document.querySelectorAll('.nd[data-i]').forEach((b,j)=>{b.classList.toggle('on',j==i);b.classList.toggle('done',m.type==='hub'?j<i:false)});
const o=m.nodes[i];$('#info').innerHTML='<b>Step '+(i+1)+' of '+n+': '+o.n+'</b><br>'+o.d+(m.type==='cycle'&&i==n-1?'<br><i>Then the cycle repeats.</i>':'');
if(m.type==='ladder'){tk.style.cssText=px([215,pos(m,i)[1]]);for(let j=0;j<n;j++){const b=$('#b'+j);b.style.width=j<=i?m.nodes[j].t*0.55/1+'px':'0';b.style.width=j<=i?(m.nodes[j].t*2.2/6)+'%':'0';$('#l'+j).textContent=j<=i?'trust ~'+m.nodes[j].t+'%':'';$('#l'+j).style.left=(240+(j<=i?m.nodes[j].t*2.2:0))/6+'%'}}
else{tk.style.cssText=px(pos(m,i));if(m.type==='hub'){setTimeout(()=>{if(st!==i)return;tk.style.cssText=px([300,210]);const hb=$('#hub');hb.classList.add('pulse');setTimeout(()=>hb.classList.remove('pulse'),600)},900)}}}
function stop(){clearInterval(timer);timer=null;const p=$('#pl');if(p)p.textContent='Play'}
function play(){if(timer){stop();return}$('#pl').textContent='Pause';const n=D.mods[cur].nodes.length;go((st+1)%n);timer=setInterval(()=>go((st+1)%n),3600)}
const gl=$('#gl');function fg(f){gl.innerHTML=D.gl.filter(r=>r.join(' ').toLowerCase().includes(f)).map(r=>'<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join('')}
$('#q').oninput=e=>fg(e.target.value.toLowerCase());fg('');sel(0);
</script></body></html>
